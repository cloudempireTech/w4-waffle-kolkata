<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3d1d0c" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background circle badge -->
  <circle cx="160" cy="160" r="150" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Tilted Waffle Icon -->
  <g transform="translate(160, 110) rotate(-45)">
    <!-- Main Waffle Body -->
    <rect x="-44" y="-44" width="88" height="88" rx="14" fill="#6d381e"/>
    <!-- Waffle Grid indentations -->
    <rect x="-34" y="-34" width="18" height="18" rx="3" fill="#442110"/>
    <rect x="-8" y="-34" width="18" height="18" rx="3" fill="#442110"/>
    <rect x="16" y="-34" width="18" height="18" rx="3" fill="#442110"/>
    
    <rect x="-34" y="-8" width="18" height="18" rx="3" fill="#442110"/>
    <rect x="-8" y="-8" width="18" height="18" rx="3" fill="#442110"/>
    <rect x="16" y="-8" width="18" height="18" rx="3" fill="#442110"/>
    
    <rect x="-34" y="16" width="18" height="18" rx="3" fill="#442110"/>
    <rect x="-8" y="16" width="18" height="18" rx="3" fill="#442110"/>
    <rect x="16" y="16" width="18" height="18" rx="3" fill="#442110"/>
    
    <!-- Melted Drip at Bottom Left -->
    <path d="M -34,44 Q -28,58 -22,44 Q -16,62 -10,44 Q -4,50 2,44" fill="#6d381e"/>
  </g>

  <!-- Flowing Chocolate Drip into text -->
  <path d="M 148,155 C 148,175 162,178 162,198 C 162,204 158,206 158,212 C 158,216 166,216 166,212 C 166,206 168,180 156,165 Z" fill="#6d381e"/>
  <circle cx="162" cy="222" r="3.5" fill="#6d381e"/>

  <!-- Logo Typography -->
  <!-- "W!4" -->
  <text x="160" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#141414" letter-spacing="-3">W<tspan fill="#6d381e">!</tspan>4</text>
  
  <!-- "WAFFLE" -->
  <text x="160" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#141414" letter-spacing="4">WAFFLE</text>
</svg>
